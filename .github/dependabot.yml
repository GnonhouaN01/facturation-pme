version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      better-auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Drizzle publie des versions intermediaires (suffixe en fin de numero) que
      # Dependabot propose a tort. Mise a jour manuelle jusqu'a la version 1.0 stable.
      - dependency-name: "drizzle-orm"
      - dependency-name: "drizzle-kit"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

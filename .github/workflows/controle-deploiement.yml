name: Contrôle après déploiement

# Après chaque déploiement de production réussi (événement publié par
# Vercel), et à la main depuis main : requêtes GET publiques sur le domaine
# de production, sans secret ni écriture. Un échec fait échouer le job, et
# GitHub prévient par email. Fiche : docs/features/controle-deploiement.md.

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controle-deploiement
  cancel-in-progress: false

jobs:
  # Toujours exécuté, sans condition : un job sauté n'exécute aucun pas, et
  # l'on ne saurait pas pourquoi le contrôle n'a pas tourné. Affiche quatre
  # champs de l'événement, et rien d'autre. Valeurs passées par env, jamais
  # interpolées dans la commande.
  evenement:
    name: Afficher l'événement
    # ubuntu-24.04 et non ubuntu-latest : ubuntu-latest est Ubuntu 26 depuis
    # le 2026-10-19, que Playwright ne prend pas encore en charge pour ses
    # dépendances système (installation de Chromium : 11 min 49 s au lieu
    # d'environ 1 min). Passer à 26 quand Playwright la prendra en charge
    # (docs/CONFIGURATION.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Afficher l'événement
        env:
          NOM: ${{ github.event_name }}
          ENVIRONNEMENT: ${{ github.event.deployment.environment }}
          PRODUCTION: ${{ github.event.deployment.production_environment }}
          ETAT: ${{ github.event.deployment_status.state }}
        run: |
          echo "github.event_name : $NOM"
          echo "github.event.deployment.environment : $ENVIRONNEMENT"
          echo "github.event.deployment.production_environment : $PRODUCTION"
          echo "github.event.deployment_status.state : $ETAT"

  controler:
    name: Contrôler la production
    needs: evenement
    # Vercel nomme l'environnement « Production » ou « Production – <projet> »,
    # et marque le déploiement production_environment. Un déploiement de
    # prévisualisation, ou un état autre que success (pending, in_progress),
    # donne un job sauté.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       (startsWith(github.event.deployment.environment, 'Production') ||
        github.event.deployment.production_environment == true))
    # ubuntu-24.04 et non ubuntu-latest : ubuntu-latest est Ubuntu 26 depuis
    # le 2026-10-19, que Playwright ne prend pas encore en charge pour ses
    # dépendances système (installation de Chromium : 11 min 49 s au lieu
    # d'environ 1 min). Passer à 26 quand Playwright la prendra en charge
    # (docs/CONFIGURATION.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Adresse écrite ici, jamais lue dans l'événement (décision 3).
    env:
      ADRESSE_PRODUCTION: https://facturation-pme.vercel.app
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # Aucune dépendance : pas de npm ci.
      - name: Contrôler le site
        run: node scripts/controle-deploiement.mjs "$ADRESSE_PRODUCTION" --essais 3 --pause 20
